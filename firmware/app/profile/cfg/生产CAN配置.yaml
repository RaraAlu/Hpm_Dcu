schema_version: 3
startup:
  profile_id: 1
  revision: 8
  readiness_ttl_ms: 1000
  activation_wait_s: 5
safety:
  max_command_lease_ms: 10
  feedback_timeout_ms: 20
channels:
  - bus: 3
    mode: fd
    nominal_bitrate_kbps: 1000
    data_bitrate_kbps: 5000
    timestamp_eof: true
  - bus: 2
    mode: fd
    nominal_bitrate_kbps: 1000
    data_bitrate_kbps: 5000
    timestamp_eof: true
devices:
