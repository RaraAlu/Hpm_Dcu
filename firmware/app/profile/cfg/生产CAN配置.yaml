schema_version: 3
startup:
  profile_id: 1
  revision: 11
  readiness_ttl_ms: 1000
  activation_wait_s: 5
safety:
  max_command_lease_ms: 10
  feedback_timeout_ms: 20
channels:
  - bus: 0
    mode: classic
    nominal_bitrate_kbps: 1000
    raw_rate_limit: 1
    cyclic_sideband:
      period_us: 2000
      ustc_head_v2: {heartbeat_timeout_ms: 9000, feedback_periods: 3}
      # One PDO cycle per slot (2 ms). A name without a CAN binding never transmits.
      slots: [head_1, left_hand, head_2, right_hand, head_3, idle, head_4, idle, head_5, idle]
      frames:
        head_1: {can_id: 0x601, dlc: 8}
        head_2: {can_id: 0x602, dlc: 8}
        head_3: {can_id: 0x603, dlc: 8}
        head_4: {can_id: 0x604, dlc: 8}
        head_5: {can_id: 0x605, dlc: 8}
      # Explicit on-demand traffic, never generated by the cyclic schedule.
      service_frames:
        - {can_id: 0x60F, dlc: 5}
        - {can_id: 0x610, dlc: 5}
        - {can_id: 0x620, dlc: 8}
  - {bus: 1, mode: fd, nominal_bitrate_kbps: 1000, data_bitrate_kbps: 5000, timestamp_eof: true}
  - {bus: 2, mode: fd, nominal_bitrate_kbps: 1000, data_bitrate_kbps: 5000, timestamp_eof: true}
  - {bus: 3, mode: fd, nominal_bitrate_kbps: 1000, data_bitrate_kbps: 5000, timestamp_eof: true}
devices:
  # Bidirectional production PDOs. Never borrow bench motion parameters.
  - {id: waist_1, protocol: encos, type: 7220, bus: 1, can_id: 1, motion_parameters: pending}
  - {id: waist_2, protocol: encos, type: 7216, bus: 1, can_id: 2, motion_parameters: pending}
  - {id: waist_3, protocol: encos, type: 7216, bus: 1, can_id: 3, motion_parameters: pending}
  - {id: left_arm_1, protocol: bjcx, type: HRA55H-100, bus: 2, can_id: 1, motion_parameters: pending, status_poll_period_ms: 20, status_reply_timeout_ms: 5}
  - {id: left_arm_2, protocol: bjcx, type: HRA55H-100, bus: 2, can_id: 2, motion_parameters: pending, status_poll_period_ms: 20, status_reply_timeout_ms: 5}
  - {id: left_arm_3, protocol: bjcx, type: HRA40H-101, bus: 2, can_id: 3, motion_parameters: pending, status_poll_period_ms: 20, status_reply_timeout_ms: 5}
  - {id: left_arm_4, protocol: bjcx, type: HRA55H-100, bus: 2, can_id: 4, motion_parameters: pending, status_poll_period_ms: 20, status_reply_timeout_ms: 5}
  - {id: left_arm_5, protocol: bjcx, type: HRA40H-101, bus: 2, can_id: 5, motion_parameters: pending, status_poll_period_ms: 20, status_reply_timeout_ms: 5}
  - {id: right_arm_1, protocol: bjcx, type: HRA55H-100, bus: 3, can_id: 1, motion_parameters: pending, status_poll_period_ms: 20, status_reply_timeout_ms: 5}
  - {id: right_arm_2, protocol: bjcx, type: HRA55H-100, bus: 3, can_id: 2, motion_parameters: pending, status_poll_period_ms: 20, status_reply_timeout_ms: 5}
  - {id: right_arm_3, protocol: bjcx, type: HRA40H-101, bus: 3, can_id: 3, motion_parameters: pending, status_poll_period_ms: 20, status_reply_timeout_ms: 5}
  - {id: right_arm_4, protocol: bjcx, type: HRA55H-100, bus: 3, can_id: 4, motion_parameters: pending, status_poll_period_ms: 20, status_reply_timeout_ms: 5}
  - {id: right_arm_5, protocol: bjcx, type: HRA40H-101, bus: 3, can_id: 5, motion_parameters: pending, status_poll_period_ms: 20, status_reply_timeout_ms: 5}
