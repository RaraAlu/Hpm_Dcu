    protocol: bjcx
    type: HRA55H-100
    bus: 3
    can_id: 0x02
    neutral_mit_only: true
    neutral_mit_frame_limit: 30000
passthrough_devices:
  - id: encos_mcan2
    protocol: encos
    type: EC-A7216-P2-22H
    bus: 2
    can_id: 0x01
