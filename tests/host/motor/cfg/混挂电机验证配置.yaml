schema_version: 2
startup:
  profile_id: 3
  revision: 1
  readiness_ttl_ms: 1000
  activation_wait_s: 5
safety:
  max_command_lease_ms: 10
  feedback_timeout_ms: 20
channels:
  - bus: 2
    mode: fd
    nominal_bitrate_kbps: 1000
    data_bitrate_kbps: 5000
  - bus: 0
    mode: fd
    nominal_bitrate_kbps: 1000
    data_bitrate_kbps: 5000
devices:
  - id: fixture_encos
    protocol: encos
    bus: 2
    can_id: 3
    model_profile_id: 0x8000
    power_query_period_ms: 0
    limits:
      position_mrad: [-9000, 9000]
      velocity_mrad_s: 18000
      torque_mNm: 5000
      current_dA: 60
    encoding:
      kp: [0, 500]
      kd: [0, 5]
      position_mrad: [-10000, 10000]
      velocity_mrad_s: [-20000, 20000]
      torque_mNm: [-10000, 10000]
      current_dA: [-100, 100]
      torque_constant_cNm_A: 50
      can_timeout_ms: 100
  - id: fixture_hra40
    protocol: bjcx
    type: HRA40H-101
    bus: 2
    can_id: 36
    status_poll_period_ms: 100
    status_reply_timeout_ms: 10
  - id: fixture_hra55
    protocol: bjcx
    type: HRA55H-100
    bus: 0
    can_id: 3
    status_poll_period_ms: 100
    status_reply_timeout_ms: 10
