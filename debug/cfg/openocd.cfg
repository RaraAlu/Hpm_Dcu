# Launched only by scripts/dcu.py after explicit target-access checks.
source [find interface/jlink.cfg]
transport select jtag
adapter serial $env(DCU_JLINK_SERIAL)
adapter speed $env(DCU_JTAG_KHZ)
adapter srst delay 500
reset_config srst_only

source [find soc/hpm5e00.cfg]
# With physical nSRST, the SDK's pre-deassert arp_halt runs before the hart is available.
$_TARGET0 configure -event reset-deassert-pre {}
flash bank xpi0 hpm_xpi 0x80000000 $env(DCU_FLASH_BYTES) 1 1 $_TARGET0 \
    0xF3000000 $env(DCU_FLASH_OPT0) $env(DCU_FLASH_OPT1)

proc init_clock {} {
    mww 0xF4000800 0xFFFFFFFF
    mww 0xF4000810 0xFFFFFFFF
    mww 0xF4000820 0xFFFFFFFF
    mww 0xF4000830 0xFFFFFFFF
}
$_TARGET0 configure -event reset-init { init_clock }
$_TARGET0 configure -event gdb-attach { reset halt }
$_TARGET0 configure -event gdb-detach { halt }
bindto 127.0.0.1
gdb_port 3333
tcl_port disabled
telnet_port disabled
